# =============================================================================
# build-apk.yml  --  build a real, runnable APK (with the native engine)
# =============================================================================
#
# The native layer (proot / prootloader / libpocketspawn) is cross-compiled by
# the Android NDK, whose host tools are x86_64-only. GitHub-hosted runners are
# x86_64, so this is where the full APK actually gets built. It calls the same
# bootstrap script the developer can run locally, so there is a single source of
# truth for how to provision the toolchain.
#
# Trigger: push / PR to main, manual "Run workflow", or release publish.
#
# The built APK (which includes lib/*.so) is uploaded as a workflow artifact.
# From the Actions page you can download it directly to your phone.
#
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # x86_64 is REQUIRED: the Android NDK host tools cannot run on ARM.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Provision toolchain and build APK
        # Installs the Android SDK, NDK r26d, CMake, the pinned native
        # submodules, then assembles the online debug APK.
        run: |
          chmod +x scripts/bootstrap-and-build-apk.sh
          bash scripts/bootstrap-and-build-apk.sh --tasks :app:assembleOnlineDebug

      - name: Verify native libraries were produced
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          # The CMake build emits these shared libs for arm64-v8a; the two
          # "carrier" targets are renamed to proot / prootloader via OUTPUT_NAME.
          for so in libpocketspawn.so libproot.so libprootloader.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$so" \
              || { echo "MISSING native lib: $so -- this build is not runnable"; exit 1; }
            echo "  ok $so"
          done
          echo "native engine present"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketdev-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
