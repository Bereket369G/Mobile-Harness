# =============================================================================
# build-apk.yml  --  build a real, runnable APK (with the native engine)
# =============================================================================
#
# The native layer (proot / prootloader / libpocketspawn) is cross-compiled by
# the Android NDK, whose host tools are x86_64-only. GitHub-hosted runners are
# x86_64, so this is where the full APK actually gets built. It calls the same
# bootstrap script the developer can run locally, so there is a single source of
# truth for how to provision the toolchain.
#
# Trigger: push / PR to main, manual "Run workflow", or release publish.
#
# The built APK (which includes lib/*.so) is uploaded as a workflow artifact.
# From the Actions page you can download it directly to your phone.
#
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # x86_64 is REQUIRED: the Android NDK host tools cannot run on ARM.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Provision toolchain and build APK
        # Installs the Android SDK, NDK r26d, CMake, the pinned native
        # submodules, then assembles the online debug APK.
        #
        # The application id is overridden so this APK installs *alongside* an
        # existing PocketDev install (separate data dir + launcher icon) instead of
        # asking Android to replace it, which would wipe the user's chats and keys.
        run: |
          chmod +x scripts/bootstrap-and-build-apk.sh
          bash scripts/bootstrap-and-build-apk.sh \
            --tasks :app:assembleOnlineDebug \
            --app-id io.github.bereket369g.pocketdev \
            --app-label "PocketDev OpenCode"

      - name: Verify native libraries were produced
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          # The CMake build emits these shared libs for arm64-v8a; the two
          # "carrier" targets are renamed to proot / prootloader via OUTPUT_NAME.
          for so in libpocketspawn.so libproot.so libprootloader.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$so" \
              || { echo "MISSING native lib: $so -- this build is not runnable"; exit 1; }
            echo "  ok $so"
          done
          echo "native engine present"

      - name: Verify app identity (side-by-side install)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          # AAPT is already on PATH from the toolchain step.
          PKG=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
                | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          LABEL=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
                | sed -n "s/^application-label:'\(.*\)'$/\1/p" | head -1)
          echo "package : $PKG"
          echo "label   : $LABEL"
          [ "$PKG" = "io.github.bereket369g.pocketdev" ] \
            || { echo "FAIL: wrong applicationId '$PKG' -- this build would replace the existing app"; exit 1; }
          [ "$LABEL" = "PocketDev OpenCode" ] \
            || { echo "FAIL: wrong app label '$LABEL'"; exit 1; }
          echo "side-by-side identity OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketdev-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Attaching the APK to the Release is best-effort and must NEVER fail the
      # build. The previous `softprops/action-gh-release@v2` step *updated* the
      # release, which the default GITHUB_TOKEN cannot do on this repo
      # ("Resource not accessible by integration"), turning every
      # release-tagged run red even though the APK itself had already built,
      # been verified, and been uploaded as an artifact. `gh release upload`
      # against an already-published release is the correct operation here, and
      # any failure is tolerated so the artifact stays the source of truth.
      - name: Attach APK to Release (best effort)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "no APK found; skipping release attach"
            exit 0
          fi
          echo "attaching $(basename "$APK") to release $TAG"
          gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY" \
            || echo "WARN: could not attach APK to the release (non-fatal). The APK is still available from the 'pocketdev-apk' workflow artifact."
